<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Brain · beCopenhagen</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#111214"/>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=archivo:400,500,600,700|ibm-plex-mono:400,500" rel="stylesheet"/>
<style>
  :root{
    --asphalt:#111214;
    --asphalt-2:#191b1e;
    --asphalt-3:#212429;
    --kerb:#2c3037;
    --kerb-2:#3a3f47;
    --paint:#f2f3f4;
    --paint-2:#9aa1aa;
    --paint-3:#646b74;
    --red:#E01E37;
    --lane:#4C8DF6;
    --green:#3DBE7A;
    --r:10px;
    --r-lg:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--asphalt); color:var(--paint);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px; line-height:1.55; overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums; }

  #login{ position:fixed; inset:0; display:grid; place-items:center; padding:24px; z-index:100; }
  .card{ width:100%; max-width:330px; }
  .mark{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--paint-3); margin-bottom:14px;
  }
  .card h1{ font-size:40px; font-weight:700; letter-spacing:-.035em; line-height:1; margin-bottom:8px; }
  .card .sub{ font-size:14px; color:var(--paint-2); margin-bottom:26px; }
  .field{ margin-bottom:9px; }
  .field input{
    width:100%; padding:13px 14px; font:inherit; font-size:16px;
    background:var(--asphalt-2); color:var(--paint);
    border:1px solid var(--kerb); border-radius:var(--r); outline:none;
    transition:border-color .15s;
  }
  .field input:focus{ border-color:var(--lane); }
  .field input::placeholder{ color:var(--paint-3); }
  button.go{
    width:100%; padding:13px; margin-top:5px; font:inherit; font-size:15px; font-weight:600;
    color:#fff; background:var(--red); border:0; border-radius:var(--r); cursor:pointer;
    transition:filter .15s;
  }
  button.go:hover{ filter:brightness(1.1); }
  button.go:disabled{ opacity:.45; cursor:default; }
  #loginErr{ font-size:13px; color:var(--red); margin-top:12px; min-height:18px; }

  #app{ display:none; flex-direction:column; height:100dvh; max-width:820px; margin:0 auto; width:100%; }

  .top{
    flex:none; display:flex; align-items:center; gap:12px;
    padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top));
    border-bottom:1px solid var(--kerb);
  }
  .brand{ font-size:17px; font-weight:700; letter-spacing:-.02em; }
  .brand span{ color:var(--red); }

  /* Signature: Copenhagen's street bike-counters tally riders in a lit readout.
     This one tallies the bookings the brain currently knows about. */
  .counter{
    margin-left:auto; display:flex; align-items:center; gap:7px;
    padding:5px 11px; border-radius:var(--r);
    background:var(--asphalt-2); border:1px solid var(--kerb);
  }
  .counter .dot{
    width:5px; height:5px; border-radius:50%; background:var(--green);
    box-shadow:0 0 6px var(--green);
  }
  .counter .n{
    font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:500;
    font-variant-numeric:tabular-nums; color:var(--paint);
  }
  .counter .lbl{
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--paint-3);
  }
  .counter.cold .n{ color:var(--paint-3); }
  .counter.cold .dot{ background:var(--paint-3); box-shadow:none; }

  .ibtn{
    flex:none; width:34px; height:34px; border-radius:var(--r); cursor:pointer;
    background:var(--asphalt-2); border:1px solid var(--kerb); color:var(--paint-2);
    display:grid; place-items:center; font-size:14px; transition:.15s;
  }
  .ibtn:hover{ border-color:var(--kerb-2); color:var(--paint); }

  .thread{ flex:1; overflow-y:auto; padding:22px 18px 10px; }

  .msg{ margin-bottom:20px; }
  .msg.me{ display:flex; justify-content:flex-end; }
  .msg.me .bubble{
    max-width:82%; background:var(--red); color:#fff;
    padding:9px 14px; border-radius:var(--r-lg) var(--r-lg) 3px var(--r-lg);
    font-size:14.5px;
  }
  .msg.bot .bubble{ font-size:15px; line-height:1.6; }
  .msg.bot .bubble strong{ font-weight:600; color:#fff; }
  .msg.bot .bubble em{ color:var(--paint-2); font-style:normal; }
  .msg.bot .bubble p{ margin-bottom:10px; }
  .msg.bot .bubble p:last-child{ margin-bottom:0; }
  .msg.bot .bubble ul{ margin:8px 0 10px; padding-left:2px; list-style:none; }
  .msg.bot .bubble li{ padding-left:16px; position:relative; margin-bottom:5px; }
  .msg.bot .bubble li::before{
    content:''; position:absolute; left:2px; top:9px;
    width:5px; height:5px; border-radius:50%; background:var(--kerb-2);
  }
  .msg.bot .bubble code{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    background:var(--asphalt-3); padding:1px 5px; border-radius:4px; color:var(--lane);
  }

  .rows{
    margin-top:12px; border:1px solid var(--kerb); border-radius:var(--r);
    overflow:hidden; overflow-x:auto;
  }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--paint-3); font-weight:400;
    text-align:left; padding:8px 12px; background:var(--asphalt-2);
    border-bottom:1px solid var(--kerb); white-space:nowrap;
  }
  tbody td{
    padding:8px 12px; border-bottom:1px solid var(--asphalt-3);
    color:var(--paint-2); white-space:nowrap;
  }
  tbody tr:last-child td{ border-bottom:0; }
  tbody td.num{
    font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;
    text-align:right; color:var(--paint);
  }
  .rows-more{
    padding:7px 12px; font-size:11px; color:var(--paint-3);
    background:var(--asphalt-2); border-top:1px solid var(--kerb);
  }

  .sqlt{
    margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:.04em; color:var(--paint-3); cursor:pointer; user-select:none;
    display:inline-block; transition:color .15s;
  }
  .sqlt:hover{ color:var(--lane); }
  pre.sql{
    display:none; margin-top:8px; padding:12px 14px;
    background:var(--asphalt-2); border:1px solid var(--kerb); border-left:2px solid var(--lane);
    border-radius:var(--r); font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    line-height:1.65; color:var(--paint-2); overflow-x:auto; white-space:pre;
  }
  pre.sql.open{ display:block; }

  .think{ display:flex; gap:5px; padding:5px 0; }
  .think i{ width:6px;height:6px;border-radius:50%;background:var(--kerb-2);animation:pulse 1.2s infinite both; }
  .think i:nth-child(2){animation-delay:.15s} .think i:nth-child(3){animation-delay:.3s}
  @keyframes pulse{0%,75%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}

  .err{
    border:1px solid var(--kerb); border-left:2px solid var(--red);
    background:var(--asphalt-2); padding:11px 14px; border-radius:var(--r);
    font-size:14px; color:var(--paint-2);
  }
  .err a{ color:var(--lane); }

  .opener h2{ font-size:22px; font-weight:600; letter-spacing:-.02em; margin-bottom:6px; }
  .opener p{ font-size:14.5px; color:var(--paint-2); margin-bottom:18px; max-width:52ch; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-size:13px; padding:8px 13px; border-radius:999px; cursor:pointer;
    background:var(--asphalt-2); border:1px solid var(--kerb); color:var(--paint-2);
    transition:.15s;
  }
  .chip:hover{ border-color:var(--lane); color:var(--paint); }

  .blank{
    margin-top:8px; padding:26px 22px; text-align:center;
    background:var(--asphalt-2); border:1px dashed var(--kerb-2); border-radius:var(--r-lg);
  }
  .blank h2{ font-size:19px; font-weight:600; margin-bottom:6px; letter-spacing:-.015em; }
  .blank p{ font-size:14px; color:var(--paint-2); margin:0 auto 16px; max-width:40ch; }
  .blank button{
    padding:10px 20px; font:inherit; font-size:14px; font-weight:600; color:#fff;
    background:var(--red); border:0; border-radius:var(--r); cursor:pointer;
  }
  .blank button:hover{ filter:brightness(1.1); }

  .composer{
    flex:none; display:flex; gap:9px; padding:12px 18px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--kerb);
  }
  .composer textarea{
    flex:1; resize:none; font:inherit; font-size:16px; padding:11px 15px;
    background:var(--asphalt-2); color:var(--paint);
    border:1px solid var(--kerb); border-radius:22px; outline:none; max-height:120px;
    transition:border-color .15s;
  }
  .composer textarea:focus{ border-color:var(--lane); }
  .composer textarea::placeholder{ color:var(--paint-3); }
  .send{
    flex:none; width:40px; height:40px; border-radius:50%; border:0; cursor:pointer;
    background:var(--red); color:#fff; font-size:16px; align-self:flex-end; transition:.15s;
  }
  .send:hover{ filter:brightness(1.1); }
  .send:disabled{ opacity:.35; cursor:default; }

  .sheetbg{
    position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:60;
  }
  .sheetbg.open{ display:flex; }
  .sheet{
    width:100%; max-width:440px; background:var(--asphalt-2);
    border:1px solid var(--kerb); border-radius:var(--r-lg); padding:22px;
  }
  .sheet h2{ font-size:18px; font-weight:600; letter-spacing:-.015em; margin-bottom:5px; }
  .sheet .hint{ font-size:13.5px; color:var(--paint-2); margin-bottom:18px; line-height:1.5; }
  .sheet .hint b{ color:var(--paint); font-weight:500; }
  .drop{
    display:block; padding:15px; margin-bottom:9px; cursor:pointer;
    background:var(--asphalt); border:1px dashed var(--kerb-2); border-radius:var(--r);
    transition:.15s;
  }
  .drop:hover{ border-color:var(--lane); }
  .drop b{ font-size:13.5px; font-weight:500; display:block; }
  .drop small{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paint-3); }
  .drop.has{ border-style:solid; border-color:var(--green); background:rgba(61,190,122,.06); }
  .drop.has b{ color:var(--green); }
  .acts{ display:flex; gap:8px; margin-top:14px; }
  .btn{
    flex:1; padding:11px; font:inherit; font-size:14px; font-weight:500; cursor:pointer;
    background:transparent; color:var(--paint-2);
    border:1px solid var(--kerb); border-radius:var(--r);
  }
  .btn:hover{ color:var(--paint); border-color:var(--kerb-2); }
  .btn.primary{ background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.1); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .upmsg{ font-size:13px; margin-top:12px; min-height:18px; }
  .upmsg.err{ color:var(--red); } .upmsg.ok{ color:var(--green); }

  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="mark">beCopenhagen</div>
    <h1>Brain</h1>
    <div class="sub">Ask the business anything.</div>
    <div class="field"><input type="email" id="email" placeholder="Email" autocomplete="username"/></div>
    <div class="field"><input type="password" id="pw" placeholder="Password" autocomplete="current-password"/></div>
    <button class="go" id="loginBtn">Log in</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="top">
    <div class="brand">Brain<span>.</span></div>
    <div class="counter cold" id="counter">
      <span class="dot"></span>
      <span class="n" id="cnum">—</span>
      <span class="lbl">bookings</span>
    </div>
    <button class="ibtn" id="upBtn" title="Load new data">↑</button>
    <button class="ibtn" id="outBtn" title="Log out">⏻</button>
  </div>

  <div class="thread" id="thread"></div>

  <div class="composer">
    <textarea id="q" rows="1" placeholder="Ask about bookings, revenue, channels, occupancy…"></textarea>
    <button class="send" id="send">↑</button>
  </div>
</div>

<div class="sheetbg" id="sheetbg">
  <div class="sheet">
    <h2>Load new data</h2>
    <div class="hint">From FareHarbor, export both reports as <b>Detailed</b>, range <b>01/01/2023 → today</b>, with all columns selected. This replaces everything currently loaded.</div>
    <label class="drop" id="dropB">
      <input type="file" accept=".csv" id="fileB" hidden/>
      <span id="labB"><b>Bookings report</b><small>Choose CSV</small></span>
    </label>
    <label class="drop" id="dropS">
      <input type="file" accept=".csv" id="fileS" hidden/>
      <span id="labS"><b>Sales report</b><small>Choose CSV</small></span>
    </label>
    <div class="upmsg" id="upmsg"></div>
    <div class="acts">
      <button class="btn" id="cancelUp">Cancel</button>
      <button class="btn primary" id="doUp" disabled>Load</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const thread = $('thread'), qEl = $('q'), sendEl = $('send');
let hist = [], busy = false, hasData = false;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inline(s){
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>');
}
function md(text){
  return esc(text).split(/\n{2,}/).map(block => {
    const lines = block.split('\n').filter(l => l.trim());
    if (lines.length && lines.every(l => /^\s*[-*•]\s+/.test(l))) {
      return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*•]\s+/,'')) + '</li>').join('') + '</ul>';
    }
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('');
}

const isNum = v => typeof v === 'number';
const fmt = v => {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number')
    return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined,{maximumFractionDigits:2});
  return String(v);
};
function table(rows, total){
  if (!rows || !rows.length) return '';
  const cols = Object.keys(rows[0]);
  const head = cols.map(c => '<th>' + esc(c.replace(/_/g,' ')) + '</th>').join('');
  const body = rows.map(r => '<tr>' + cols.map(c =>
    '<td class="' + (isNum(r[c]) ? 'num' : '') + '">' + esc(fmt(r[c])) + '</td>').join('') + '</tr>').join('');
  const more = total > rows.length
    ? '<div class="rows-more">showing ' + rows.length + ' of ' + total.toLocaleString() + ' rows</div>' : '';
  return '<div class="rows"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>' + more + '</div>';
}

async function checkAuth(){
  const d = await (await fetch('/api/me')).json();
  if (d.user){ $('login').style.display='none'; $('app').style.display='flex'; await loadStatus(); opener(); }
  else { $('login').style.display='grid'; $('app').style.display='none'; }
}
$('loginBtn').onclick = async () => {
  const b = $('loginBtn'); b.disabled = true; $('loginErr').textContent = '';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
      body: JSON.stringify({ email:$('email').value, password:$('pw').value })});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Login failed');
    $('pw').value=''; await checkAuth();
  }catch(e){ $('loginErr').textContent = e.message; }
  finally{ b.disabled = false; }
};
$('pw').addEventListener('keydown', e => { if(e.key==='Enter') $('loginBtn').click(); });
$('email').addEventListener('keydown', e => { if(e.key==='Enter') $('pw').focus(); });
$('outBtn').onclick = async () => { await fetch('/api/logout',{method:'POST'}); location.reload(); };

async function loadStatus(){
  try{
    const s = await (await fetch('/api/status')).json();
    hasData = !!s.loaded;
    const c = $('counter'), n = $('cnum');
    if(!s.loaded){ c.classList.add('cold'); n.textContent = '—'; return; }
    c.classList.remove('cold');
    const target = s.bookings || 0;
    let cur = 0;
    const step = Math.max(1, Math.round(target/28));
    const t = setInterval(() => {
      cur = Math.min(target, cur + step);
      n.textContent = cur.toLocaleString();
      if (cur >= target) clearInterval(t);
    }, 22);
  }catch(_){}
}

function opener(){
  thread.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'msg bot';
  if (!hasData){
    d.innerHTML =
      '<div class="blank">' +
        '<h2>No data loaded</h2>' +
        '<p>Export the bookings and sales reports from FareHarbor, then load them here to start asking questions.</p>' +
        '<button id="blankUp">Load data</button>' +
      '</div>';
    thread.appendChild(d);
    $('blankUp').onclick = () => $('sheetbg').classList.add('open');
    return;
  }
  d.innerHTML =
    '<div class="opener">' +
      '<h2>What do you want to know?</h2>' +
      '<p>I read the booking, sales and departure data directly, and show you the query behind every answer.</p>' +
      '<div class="chips">' +
        ['Do people book more on Sundays?',
         'Which channel nets most after commission?',
         'Which time slots run empty?',
         'Rentals year over year',
         'Average lead time by product',
         'Where do our customers come from?']
        .map(c => '<span class="chip">' + c + '</span>').join('') +
      '</div>' +
    '</div>';
  thread.appendChild(d);
}

function bubble(html, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<div class="bubble">' + html + '</div>';
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
  return d;
}

async function ask(question){
  if (busy || !question.trim()) return;
  busy = true; sendEl.disabled = true;
  if (thread.querySelector('.opener, .blank')) thread.innerHTML = '';
  bubble(esc(question), 'me');
  qEl.value = ''; qEl.style.height = 'auto';
  const pending = bubble('<div class="think"><i></i><i></i><i></i></div>', 'bot');

  try{
    const r = await fetch('/api/ask',{ method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ question, history: hist }) });
    const d = await r.json();
    pending.remove();

    if (r.status === 401){ location.reload(); return; }
    if (!r.ok){
      const msg = d.error || 'Something went wrong.';
      const el = bubble('<div class="err">' + esc(msg) + '</div>', 'bot');
      if (/no data/i.test(msg)){
        const box = el.querySelector('.err');
        box.innerHTML += ' <a href="#" id="errUp">Load data</a>';
        $('errUp').onclick = e => { e.preventDefault(); $('sheetbg').classList.add('open'); };
      }
      return;
    }

    let html = md(d.answer);
    if (d.rows && d.rows.length) html += table(d.rows, d.rowCount);
    const el = bubble(html, 'bot');

    if (d.sql){
      const t = document.createElement('div');
      t.className = 'sqlt';
      const label = (open) => (open ? 'hide query · ' : 'show query · ') + (d.rowCount||0).toLocaleString() + ' rows';
      t.textContent = label(false);
      const pre = document.createElement('pre');
      pre.className = 'sql';
      pre.textContent = d.sql;
      t.onclick = () => { pre.classList.toggle('open'); t.textContent = label(pre.classList.contains('open')); };
      el.appendChild(t); el.appendChild(pre);
      thread.scrollTop = thread.scrollHeight;
    }

    hist.push({role:'user',content:question});
    hist.push({role:'assistant',content:d.answer});
    hist = hist.slice(-6);
  }catch(e){
    pending.remove();
    bubble('<div class="err">' + esc(e.message) + '</div>', 'bot');
  }finally{
    busy = false; sendEl.disabled = false;
  }
}
sendEl.onclick = () => ask(qEl.value);
qEl.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(qEl.value); } });
qEl.addEventListener('input', () => { qEl.style.height='auto'; qEl.style.height = Math.min(qEl.scrollHeight,120)+'px'; });
document.addEventListener('click', e => { if (e.target.classList.contains('chip')) ask(e.target.textContent); });

let csvB = null, csvS = null;
$('upBtn').onclick = () => $('sheetbg').classList.add('open');
$('cancelUp').onclick = () => $('sheetbg').classList.remove('open');
$('sheetbg').onclick = e => { if (e.target === $('sheetbg')) $('sheetbg').classList.remove('open'); };
function wire(input, drop, lab, set){
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      set(rd.result);
      $(drop).classList.add('has');
      $(lab).innerHTML = '<b>✓ ' + esc(f.name) + '</b><small>' + Math.round(f.size/1024).toLocaleString() + ' KB</small>';
      $('doUp').disabled = !(csvB && csvS);
    };
    rd.readAsText(f);
  };
}
wire($('fileB'),'dropB','labB', t => { csvB = t; });
wire($('fileS'),'dropS','labS', t => { csvS = t; });
$('doUp').onclick = async () => {
  $('doUp').disabled = true;
  const m = $('upmsg'); m.className = 'upmsg'; m.textContent = 'Loading…';
  try{
    const r = await fetch('/api/upload',{ method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ bookings_csv: csvB, sales_csv: csvS }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Load failed');
    m.className = 'upmsg ok'; m.textContent = d.message || 'Loaded.';
    await loadStatus();
    setTimeout(() => { $('sheetbg').classList.remove('open'); opener(); }, 1200);
  }catch(e){
    m.className = 'upmsg err'; m.textContent = e.message;
    $('doUp').disabled = false;
  }
};

checkAuth();
</script>
</body>
